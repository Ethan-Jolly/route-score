name: Route Score ingest

# Pulls route performance from HSP straight into the database. This runs here
# rather than on Vercel because a single HSP call can take up to two minutes —
# longer than a serverless function is allowed to run. The job is resumable:
# every chunk is stored as it lands and each run re-plans from what's stored.
#
# Budget: a private repo gets 2,000 free Actions minutes a month. One 50-minute
# run a day uses ~1,600. Raise `minutes` or add schedule entries if the repo is
# public (unlimited) or you have minutes to spare.

on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC (off the hour: scheduled runs start more reliably)
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to ingest for"
        default: "50"

# Never run two ingests at once — they'd fight over HSP's ~4-call limit.
concurrency:
  group: route-score-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # runs the TypeScript script directly (needs >= 22.18)
          cache: npm
      - run: npm ci
      - name: Ingest
        env:
          # Set in repo Settings → Secrets and variables → Actions.
          HSP_EMAIL: ${{ secrets.HSP_EMAIL }}
          HSP_PASSWORD: ${{ secrets.HSP_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MINUTES: ${{ inputs.minutes || '50' }}
        run: node scripts/ingest.ts --minutes="$MINUTES"

name: Route Score ingest

# Pulls route performance from HSP straight into the database. This runs here
# rather than on Vercel because a single HSP call can take up to two minutes —
# longer than a serverless function is allowed to run. The job is resumable:
# every chunk is stored as it lands and each run re-plans from what's stored.
#
# The repo is public, so Actions minutes are free and the real ceiling is HSP
# itself (~4 concurrent calls per account). Four 5-hour runs a day keep it
# busy about 20 hours in 24; a run ends early when there is nothing left to do.
# If the repo is ever made private again, cut this back to one 50-minute run a
# day (a private repo gets 2,000 free minutes a month).
#
# Note: GitHub pauses scheduled workflows in a public repo after 60 days with
# no commits. It emails first; re-enable from the Actions tab.

on:
  schedule:
    - cron: "17 3,9,15,21 * * *" # every 6 hours (off the hour: scheduled runs start more reliably)
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to ingest for"
        default: "300"

# Never run two ingests at once — they'd fight over HSP's ~4-call limit. A run
# that is still going when the next is due makes the next one wait.
concurrency:
  group: route-score-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # runs the TypeScript script directly (needs >= 22.18)
          cache: npm
      - run: npm ci
      - name: Ingest
        env:
          # Set in repo Settings → Secrets and variables → Actions.
          HSP_EMAIL: ${{ secrets.HSP_EMAIL }}
          HSP_PASSWORD: ${{ secrets.HSP_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # 2 of HSP's ~4 concurrent calls; the live site keeps the other 2 for
          # visitors warming a new route.
          HSP_CONCURRENCY: "2"
          MINUTES: ${{ inputs.minutes || '300' }}
        run: node scripts/ingest.ts --minutes="$MINUTES"
